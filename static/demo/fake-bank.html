<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NorthPeak Bank – Card Verification</title>
<style>
body{margin:0;font:15px/1.5 Arial,sans-serif;background:#eef2f7;color:#1b2a3a}
.demo{background:#ffe08a;color:#3a2a00;text-align:center;padding:6px;font-size:12px}
.top{background:#0b3d6e;color:#fff;padding:14px 16px;font-size:20px;font-weight:bold}
.wrap{max-width:460px;margin:30px auto;background:#fff;border-radius:8px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.alert{background:#fde8e8;border-left:4px solid #c62828;padding:10px 12px;margin-bottom:16px}
label{display:block;margin-top:12px;font-weight:bold;font-size:13px}
input{width:100%;padding:9px;border:1px solid #b8c4d0;border-radius:4px;font-size:15px;box-sizing:border-box}
.row{display:flex;gap:10px}.row>div{flex:1}
button{margin-top:18px;width:100%;padding:11px;background:#0b3d6e;color:#fff;border:0;border-radius:4px;font-size:16px}
</style>
</head>
<body>
<div class="demo">⚠ SAYNO DEMO PAGE — a fictional bank used to demonstrate phishing detection. Not a real site.</div>
<div class="top">🏔 NorthPeak Bank</div>
<div class="wrap">
  <div class="alert"><b>Security alert:</b> Your new debit card has been <b>suspended</b> due to unusual activity. Verify your card within 24 hours to avoid permanent closure.</div>
  <form onsubmit="return false">
    <label for="cardnumber">Card number</label>
    <input id="cardnumber" name="cardnumber" inputmode="numeric" placeholder="1234 5678 9012 3456">
    <div class="row">
      <div><label for="exp">Expiry date</label><input id="exp" name="exp-date" placeholder="MM/YY"></div>
      <div><label for="cvv">CVV</label><input id="cvv" name="cvv" placeholder="123"></div>
    </div>
    <label for="pin">Card PIN</label>
    <input id="pin" name="pin" type="password" placeholder="4 digits">
    <button>Verify my card</button>
  </form>
</div>
</body>
</html>
